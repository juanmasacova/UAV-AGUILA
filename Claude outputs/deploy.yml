name: Build and deploy documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate analysis tables from the design point
        run: python analysis/make_tables.py

      # The generated files must be byte-reproducible for this check to mean
      # anything, which is why make_tables.py puts no timestamp in its output.
      - name: Fail if the committed tables are out of date
        run: |
          if ! git diff --quiet -- includes/; then
            echo "::error::includes/ does not match analysis/aguila.py."
            echo ""
            echo "Fix it locally with:"
            echo "    python analysis/make_tables.py"
            echo "then commit the changed files in includes/ and push again."
            echo ""
            echo "What differs:"
            git --no-pager diff -- includes/
            exit 1
          fi
          echo "Generated tables match the design point."

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
