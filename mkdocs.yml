site_name: UAV AGUILA
site_description: >-
  Design, analysis and manufacture of a 3D-printed tilt-wing VTOL UAV with
  autonomous payload delivery. A full engineering cycle, documented as it happens.
site_author: Juan Martínez
site_url: https://juanmasacova.github.io/UAV-AGUILA/

repo_url: https://github.com/juanmasacova/UAV-AGUILA
repo_name: UAV-AGUILA
edit_uri: edit/main/docs/

copyright: © Juan Martínez

theme:
  name: material
  language: en
  # Do not load Roboto from Google Fonts. The typeface is set in
  # docs/stylesheets/extra.css instead (Helvetica, with metric-compatible
  # fallbacks). Side benefit: no external font request, so the site loads
  # a little faster and works offline.
  font: false
  icon:
    # No logo icon. Material always renders *some* logo mark, so the header
    # button is hidden in docs/stylesheets/extra.css; the site name carries
    # the header on its own.
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{slug}"
      post_excerpt: optional
      archive: false
      categories_toc: true

# Three tabs. Overview is the front door, Program holds the whole engineering
# record in one place, Blog is the running commentary.
nav:
  - Overview: index.md

  - Program:
      - program/index.md
      - Where things stand:
          - Stages: program/status.md
          - Decision log: program/decision-log.md
      - Requirements:
          - requirements/index.md
          - Regulatory: requirements/regulatory.md
      - Design:
          - design/index.md
          - Wing pivot: design/wing-pivot.md
      - Analysis:
          - analysis/index.md
          - Sizing: analysis/sizing.md
          - Propulsion: analysis/propulsion.md
          - Configuration trade study: analysis/trade-study.md
          - Hover control authority: analysis/control-authority.md
          - Transition envelope: analysis/transition-envelope.md
      - Build:
          - build/index.md
          - Print log: build/print-log.md
      - Test:
          - test/index.md
          - Flight log: test/flight-log.md
      - Procurement:
          - procurement/index.md
      - Superseded studies:
          - Tilt-wing study: program/studies/study-02-tiltwing.md
          - Quadplane study: program/studies/study-01-quadplane.md

  - Blog: blog/index.md
