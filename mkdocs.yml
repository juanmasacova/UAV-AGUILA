site_name: UAV AGUILA
site_description: >-
  Design, analysis and manufacture of a 3D-printed tilt-wing VTOL UAV with
  autonomous payload delivery. A full engineering cycle, documented as it happens.
site_author: Juan Martínez
site_url: https://juanmasacova.github.io/AGUILA-UAV/

repo_url: https://github.com/juanmasacova/AGUILA-UAV
repo_name: AGUILA-UAV
edit_uri: edit/main/docs/

copyright: © Juan Martínez

theme:
  name: material
  language: en
  icon:
    logo: material/airplane
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

nav:
  - Overview: index.md
  - Program:
      - program/index.md
      - Decision log: program/decision-log.md
      - Stages: program/status.md
      - Studies (not adopted):
          - Tilt-wing study: program/studies/study-02-tiltwing.md
          - Quadplane study: program/studies/study-01-quadplane.md
  - Things learned: notes/things-learned.md
  - Requirements:
      - requirements/index.md
      - Regulatory: requirements/regulatory.md
  - Design:
      - design/index.md
      - Wing pivot: design/wing-pivot.md
  - Analysis:
      - analysis/index.md
      - Sizing: analysis/sizing.md
      - Propulsion: analysis/propulsion.md
      - Configuration trade study: analysis/trade-study.md
      - Hover control authority: analysis/control-authority.md
      - Transition envelope: analysis/transition-envelope.md
  - Build:
      - build/index.md
      - Print log: build/print-log.md
  - Test:
      - test/index.md
      - Flight log: test/flight-log.md
  - Procurement:
      - procurement/index.md
